name: CI — Nutri-RAG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Backend quality — lint, type-check, syntax, unit tests
  # -----------------------------------------------------------------------
  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check (compile all .py files)
        run: python -m compileall -q .

      - name: Smoke import (validate factory wiring)
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          GROQ_API_KEY: placeholder-groq-key
        run: python -c "from app.factory import create_app; app=create_app(); print('App title:', app.title)"

      - name: Run unit tests
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder-key
          GROQ_API_KEY: placeholder-groq-key
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # -----------------------------------------------------------------------
  # Job 2: Frontend quality — validate required static files exist
  # -----------------------------------------------------------------------
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required frontend assets
        run: |
          echo "Checking required frontend files..."
          test -f frontend/index.html && echo "✅ index.html"
          test -f frontend/chat.html  && echo "✅ chat.html"
          test -f frontend/script.js  && echo "✅ script.js"
          test -f frontend/style.css  && echo "✅ style.css"
          echo "All frontend assets verified."

  # -----------------------------------------------------------------------
  # Job 3: Docker build — ensure the Dockerfile compiles cleanly
  # -----------------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --tag nutri-rag-backend:ci \
            --label "git-sha=${{ github.sha }}" \
            ./backend
